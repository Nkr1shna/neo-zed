id = "codex-usage-plugin"
name = "Codex Usage Plugin"
version = "0.1.0"
schema_version = 1
authors = ["Neo Zed"]
repository = "https://github.com/Nkr1shna/neo-zed"
homepage = "https://github.com/Nkr1shna/neo-zed"
entry = "codex-usage-plugin"
description = "Plugin-provided ChatGPT Codex usage UI for the mirror runtime."

[[panels]]
id = "codex-usage-panel"
title = "Codex Usage"
dock = "right"
icon_name = "ai_open_ai"
tooltip = "Open the Codex usage panel."
activation = "on_startup"

[[panels]]
id = "plugin-surface-fixture-panel"
title = "Plugin Surface Fixture"
dock = "right"
icon_name = "box_open"
tooltip = "Open the plugin surface validation fixture."
activation = "on_demand"

[[titlebar_widgets]]
id = "codex-usage-titlebar"
title = "Codex Usage"
icon_name = "ai_open_ai"
tooltip = "Open the Codex usage panel."
side = "right"
priority = 100
opens_panel_id = "codex-usage-panel"

[[titlebar_widgets]]
id = "plugin-surface-fixture-titlebar"
title = "Plugin Surface Fixture"
icon_name = "box_open"
tooltip = "Open the plugin surface validation fixture."
side = "right"
priority = 90
opens_panel_id = "plugin-surface-fixture-panel"

[[actions]]
id = "increment-fixture-counter"
title = "Increment Fixture Counter"
description = "Increment the plugin surface fixture action counter."
