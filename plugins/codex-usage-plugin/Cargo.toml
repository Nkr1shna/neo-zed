[package]
name = "codex-usage-plugin"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[features]
default = []
mirror = ["dep:gpui_plugin", "dep:ui_plugin"]

[[bin]]
name = "codex-usage-plugin"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
gpui_plugin = { workspace = true, optional = true }
keyring = "3.6.3"
open.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smol.workspace = true
ui_plugin = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
