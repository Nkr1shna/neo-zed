commands:
  install: cargo fetch
  fmt: cargo fmt --all -- --check
  lint: ./script/clippy
  typecheck: cargo check --workspace --all-targets
  test: cargo test -p gpui_plugin --tests -- --test-threads=6 && cargo test -p ui_plugin --tests -- --test-threads=6 && cargo test -p plugin_host --tests -- --test-threads=6 && cargo test -p command_palette --lib --tests -- --test-threads=6 && cargo test -p keymap_editor --lib --tests -- --test-threads=6 && cargo test -p workspace --lib --tests -- --test-threads=6 && ./script/check-keymaps
  test_gpui_plugin: cargo test -p gpui_plugin --tests -- --test-threads=6
  test_ui_plugin: cargo test -p ui_plugin --tests -- --test-threads=6
  test_plugin_host: cargo test -p plugin_host --tests -- --test-threads=6
  test_command_palette: cargo test -p command_palette --lib --tests -- --test-threads=6
  test_keymap_editor: cargo test -p keymap_editor --lib --tests -- --test-threads=6
  test_workspace: cargo test -p workspace --lib --tests -- --test-threads=6
  test_codex_usage_plugin_mirror: cargo test -p codex-usage-plugin --features mirror --tests
  check_keymaps: ./script/check-keymaps
  build_visual_test_runner: cargo build -p zed --bin zed_visual_test_runner --features visual-tests
  build: cargo build --workspace --bins --examples

services: {}
